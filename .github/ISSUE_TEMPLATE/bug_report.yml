name: Bug report
description: Report a reproducible problem without confidential student data.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Problem
      description: Describe what failed; use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Relevant tests and environment
      description: PHP version, MySQL version, commands and output without secrets.
