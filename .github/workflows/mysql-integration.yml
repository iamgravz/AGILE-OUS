name: MySQL Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: MySQL schema, auth and registration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic_root_test_only
          MYSQL_DATABASE: agile_ous
          MYSQL_USER: agile_app
          MYSQL_PASSWORD: synthetic_app_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -psynthetic_root_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: agile_ous
      DB_USER: agile_app
      DB_PASSWORD: synthetic_app_test_only
      SESSION_SECURE: 'false'
      RUN_E2E_TESTS: 'yes'
      ACADEMIC_ROLE_TRANSITIONS_ENABLED: 'true' # Disposable, synthetic CI data only
      HTTP_TEST_PASSWORD: 'SyntheticHTTPPassword!2026'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, sodium
          coverage: none
      - name: Apply and verify migrations
        run: |
          php scripts/migrate.php
          php scripts/migrate.php
      - name: Set disposable CI MFA encryption secret
        run: echo "MFA_KEY_B64=$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Test privileged MFA enrollment and challenge lifecycle
        run: php tests/mfa_integration.php
      - name: Run real MySQL integration tests
        run: php tests/mysql_integration.php
      - name: Test role-specific applications and reviewer permissions
        run: php tests/workflow_integration.php
      - name: Extended system and automation integration tests
        run: php tests/extended_integration.php
      - name: Independent identity and email-recovery integration
        run: php tests/security_identity_mail_integration.php
      - name: Test Phase 7 provisional academic screening and appeals
        run: php tests/academic_casework_integration.php
      - name: Validate fail-closed malware quarantine and access
        run: php tests/attachment_scan_integration.php
      - name: Validate private-file encrypted CLI backup and isolated restore
        shell: bash
        run: |
          export AGILE_FILE_BACKUP_KEY_B64="$(php -r 'echo base64_encode(random_bytes(32));')"
          export AGILE_FILE_BACKUP_DIR="$RUNNER_TEMP/agile-file-archives"
          export AGILE_PRIVATE_FILES_DIR="$RUNNER_TEMP/agile-synthetic-private"
          mkdir -p "$AGILE_PRIVATE_FILES_DIR" "$AGILE_FILE_BACKUP_DIR"
          key="$(php -r 'echo bin2hex(random_bytes(20));')"
          printf '%s' 'synthetic private document for isolated CI' > "$AGILE_PRIVATE_FILES_DIR/$key.pdf"
          php scripts/private_file_backup.php backup
          encrypted="$(find "$AGILE_FILE_BACKUP_DIR" -maxdepth 1 -type f -name '*.afb' | head -n 1)"
          test -f "$encrypted"
          php scripts/private_file_backup.php verify "$encrypted"
          mkdir -p "$RUNNER_TEMP/agile_restore_files_ci"
          AGILE_ALLOW_ISOLATED_RESTORE=true php scripts/private_file_backup.php restore "$encrypted" "$RUNNER_TEMP/agile_restore_files_ci"
          cmp "$AGILE_PRIVATE_FILES_DIR/$key.pdf" "$RUNNER_TEMP/agile_restore_files_ci/$key.pdf"
          echo 'PASS: encrypted private-document CLI backup, verify and recovery'
      - name: Test encrypted database backup and isolated restore
        shell: bash
        run: |
          if ! command -v mysqldump >/dev/null || ! command -v mysql >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client
          fi
          export AGILE_BACKUP_KEY_B64="$(php -r 'echo base64_encode(random_bytes(32));')"
          export AGILE_BACKUP_DIR="$RUNNER_TEMP/agile-encrypted-backups"
          php scripts/secure_backup.php backup
          encrypted="$(find "$AGILE_BACKUP_DIR" -maxdepth 1 -name '*.abk' -type f | head -n 1)"
          test -f "$encrypted"
          php scripts/secure_backup.php verify "$encrypted"
          if grep -a -q 'Synthetic Volunteer' "$encrypted"; then
            echo 'FAIL: encrypted backup leaked synthetic plaintext'
            exit 1
          fi
          export DB_USER=root
          export DB_PASSWORD=synthetic_root_test_only
          mysql -h 127.0.0.1 -P 3306 -u root -psynthetic_root_test_only \
            -e 'CREATE DATABASE agile_restore_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          AGILE_ALLOW_ISOLATED_RESTORE=true php scripts/secure_backup.php restore "$encrypted" agile_restore_ci
          original="$(mysql -h 127.0.0.1 -P 3306 -u root -psynthetic_root_test_only -N -e 'SELECT COUNT(*) FROM agile_ous.members')"
          recovered="$(mysql -h 127.0.0.1 -P 3306 -u root -psynthetic_root_test_only -N -e 'SELECT COUNT(*) FROM agile_restore_ci.members')"
          if [[ "$original" != "$recovered" ]]; then
            echo 'FAIL: restore count does not match original'
            exit 1
          fi
          echo 'PASS: authenticated database backup, verification and isolated restore'
      - name: Seed synthetic HTTP staff account
        run: php tests/seed_http_user.php
      - name: Start local PHP application
        run: |
          php -S 127.0.0.1:8090 -t public public/router.php > /tmp/agile-http.log 2>&1 &
          echo $! > /tmp/agile-http.pid
      - name: Exercise HTTP registration and login
        run: |
          if ! bash tests/http_smoke.sh; then
            echo 'PHP server log (synthetic test environment):'
            tail -n 120 /tmp/agile-http.log || true
            exit 1
          fi
      - name: Seed Phase 10 synthetic multi-role fixtures
        shell: bash
        run: |
          echo "PHASE10_FIXTURE=$RUNNER_TEMP/phase10_acceptance.json" >> "$GITHUB_ENV"
          PHASE10_FIXTURE="$RUNNER_TEMP/phase10_acceptance.json" php tests/seed_phase10_acceptance.php
      - name: Phase 10 role-based HTTP staging acceptance
        shell: bash
        run: bash tests/phase10_http_acceptance.sh
      - name: Validate acceptance invariants and release gates
        shell: bash
        run: |
          php tests/staging_acceptance_report.php
          php scripts/staging_acceptance_report.php > "$RUNNER_TEMP/phase10-acceptance.json"
          jq -e '.all_schema_invariants_passed == true and .production_release_authorized == false and .mode == "synthetic_ci"' \
            "$RUNNER_TEMP/phase10-acceptance.json"
      - name: Publish sanitized synthetic CI acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase10-synthetic-acceptance-evidence
          path: ${{ runner.temp }}/phase10-acceptance.json
          retention-days: 7
