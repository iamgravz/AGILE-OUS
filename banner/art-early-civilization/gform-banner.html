<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Art in Early Civilization Banner</title>
<style>
  :root { --gold:#d9a94a; --gold-hi:#f3d48a; --cream:#efe3c8; }
  html, body { margin:0; padding:0; background:#0d0907; }
  .banner {
    position:relative; width:1600px; height:400px; overflow:hidden;
    background:#120c08 url(img/stage.jpg) center 55% / 1600px auto no-repeat;
    font-family:"Bookman Old Style","Bookman",Georgia,serif;
  }
  .valance { position:absolute; top:-18px; left:0; width:1600px; height:auto; z-index:3;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.6)); }
  .glow { position:absolute; inset:0; z-index:1;
    background:radial-gradient(ellipse 520px 220px at 50% 62%, rgba(217,169,74,.18), transparent 70%); }
  .frame { position:absolute; z-index:2; border:4px solid var(--gold); padding:6px;
    background:#1a120c; box-shadow:0 10px 24px rgba(0,0,0,.7), inset 0 0 0 1px #6b4f1d; }
  .frame img { display:block; width:100%; height:100%; object-fit:cover; }
  .f-left  { left:205px;  top:118px; width:250px; height:190px; transform:rotate(-3deg); }
  .f-right { right:205px; top:118px; width:250px; height:190px; transform:rotate(3deg); }
  .center { position:absolute; z-index:2; left:0; right:0; top:128px; text-align:center; }
  .kicker { color:var(--cream); font-family:Calibri,"Segoe UI",sans-serif; font-size:19px;
    letter-spacing:7px; text-transform:uppercase; opacity:.9; }
  h1 { margin:6px 0 0; font-size:66px; line-height:1.02; font-weight:700; color:var(--gold);
    background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 55%,#a87a2a 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.8)); }
  .rule { display:flex; align-items:center; justify-content:center; gap:14px; margin:14px auto 12px; }
  .rule span { width:120px; height:2px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .rule span:last-child { background:linear-gradient(270deg,transparent,var(--gold)); }
  .rule i { width:10px; height:10px; background:var(--gold); transform:rotate(45deg); }
  .meta { color:var(--cream); font-family:Calibri,"Segoe UI",sans-serif; font-size:23px; letter-spacing:1.5px; }
  .meta b { color:var(--gold-hi); font-weight:700; }
  .meta .dot { color:var(--gold); margin:0 12px; }
</style>
</head>
<body>
<div class="banner">
  <div class="glow"></div>
  <img class="valance" src="img/valance.png" alt="">
  <div class="frame f-left"><img src="img/lascaux.jpg" alt="Lascaux cave paintings"></div>
  <div class="frame f-right"><img src="img/egypt.jpg" alt="Egyptian tomb painting"></div>
  <div class="center">
    <div class="kicker">Art Appreciation</div>
    <h1>Art in Early<br>Civilization</h1>
    <div class="rule"><span></span><i></i><span></span></div>
    <div class="meta"><b>Group 2</b><span class="dot">◆</span>BSITOU3-2</div>
  </div>
</div>
</body>
</html>
