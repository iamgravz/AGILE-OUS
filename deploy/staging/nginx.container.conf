# Isolated HTTPS-only ingress. Bind to 127.0.0.1 by default in Compose.
# Approved edge proxy must enforce the intended hostname and TLS policy.
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /srv/agile/public;
    index index.php;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # The PHP front controller also sets some of these headers. Normalize
    # FastCGI responses to one authoritative Nginx header value so browsers
    # never receive duplicated, comma-joined security policies.
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Cache-Control;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Disable browser hardware/API surfaces unused by this student portal.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control "no-store" always;

    # Resolve service addresses at request time: config validation does not
    # depend on the app container already running.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_backend app:9000;

    location ~ /\. { return 404; }
    location ~* \.(?:php|phtml|phar|env|sql|log|bak|afb|abk|dump|pem|key)$ { return 404; }
    location ~* ^/(?:storage|vendor|tests|scripts|database|jobs|app|deploy)/ { return 404; }

    location / {
        try_files $uri @front_controller;
    }

    location @front_controller {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/agile/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass $php_backend;
        fastcgi_read_timeout 60s;
    }

    # The front controller is reached only by internal Nginx rewrites.
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/agile/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass $php_backend;
    }
}
